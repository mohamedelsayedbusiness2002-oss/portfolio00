<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="gradAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="gradBefore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8321A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8321A" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="580" height="320" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="30" y1="90" x2="550" y2="90" stroke="#1f1f1f" stroke-dasharray="3,3"/>
  <line x1="30" y1="150" x2="550" y2="150" stroke="#1f1f1f" stroke-dasharray="3,3"/>
  <line x1="30" y1="210" x2="550" y2="210" stroke="#1f1f1f" stroke-dasharray="3,3"/>
  <line x1="30" y1="270" x2="550" y2="270" stroke="#252525"/>

  <!-- Top Status Bar -->
  <rect x="20" y="16" width="540" height="42" rx="6" fill="#181818" stroke="#2a2a2a"/>
  
  <circle cx="42" cy="37" r="4" fill="#10B981" filter="url(#glow)"/>
  <text x="56" y="41" fill="#FFFFFF" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" letter-spacing="1.5">VIRAL CONVERSION · ACTIVE</text>

  <rect x="360" y="24" width="188" height="26" rx="4" fill="#111111" stroke="#333333"/>
  <text x="454" y="41" fill="#888888" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="1">TikTok Ads Manager</text>

  <!-- Key Stat Callout Header -->
  <text x="32" y="82" fill="#777777" font-family="'Space Mono', monospace" font-size="10" letter-spacing="1.5">PERFORMANCE TRAJECTORY</text>
  <text x="548" y="84" fill="#10B981" font-family="'Bebas Neue', sans-serif" font-size="24" text-anchor="end" letter-spacing="1">13.33× ROAS</text>

  <!-- Graph Trend Area Fill -->
  <path d="M30,260 Q150,240 310,120 T550,55 L550,280 L30,280 Z" fill="url(#gradAfter)" />

  <!-- Graph Trend Line -->
  <path d="M30,260 Q150,240 310,120 T550,55" fill="none" stroke="#10B981" stroke-width="3" filter="url(#glow)"/>

  <!-- Peak Dot Indicator -->
  <circle cx="550" cy="50" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Bottom Metric Strip -->
  <rect x="20" y="278" width="540" height="32" rx="4" fill="#141414" stroke="#222222"/>
  <text x="36" y="299" fill="#F5F2ED" font-family="'Space Mono', monospace" font-size="10" letter-spacing="1">Sales: EGP 763K</text>
  <text x="270" y="299" fill="#F5F2ED" font-family="'Space Mono', monospace" font-size="10" text-anchor="middle" letter-spacing="1">Clicks: 106K</text>
  <text x="544" y="299" fill="#10B981" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" text-anchor="end" letter-spacing="1">CTR: 4.75%</text>
</svg>